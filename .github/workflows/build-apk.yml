name: Build Android APK

on:
  push:
    branches: [main, dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build-apk:
    name: Build APK (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline

      - name: Write Expo runtime environment
        working-directory: mobile
        run: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_API_BASE_URL=${{ secrets.API_BASE_URL }}
          EXPO_PUBLIC_MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          EOF

      - name: Prebuild Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle executable
        working-directory: mobile/android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK to artifact folder
        run: |
          mkdir -p build
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build/asaaniyat-preview.apk
          ls -lh build/asaaniyat-preview.apk
          echo "APK_SIZE=$(du -sh build/asaaniyat-preview.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asaaniyat-preview-apk-${{ github.sha }}
          path: build/asaaniyat-preview.apk
          retention-days: 14
          if-no-files-found: error

      - name: Post build summary
        if: always()
        run: |
          echo "## APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ----- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build type | Debug APK generated from Expo prebuild |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK size | ${APK_SIZE:-not produced} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runtime environment file
        if: always()
        working-directory: mobile
        run: rm -f .env
